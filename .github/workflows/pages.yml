name: Publish climate housing page

on:
  push:
    branches: [main]
    paths:
      - 'output/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check publishable bundle
        run: |
          for file in index.html climate-risk-housing.html output/climate-risk-housing.html climate-risk-housing.css climate-risk-housing.js climate-risk-housing-features.js climate-risk-housing-events.js climate-risk-housing-geography.js climate-risk-housing-county-history.js climate-risk-housing-playbook.js; do
            test -s "output/$file" || exit 1
          done
          node --check output/climate-risk-housing.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
