<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bivariate County Map</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f4f4f0;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    label { color: #555; font-weight: 500; }

    select, input[type=range] {
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 4px 8px;
      background: #fff;
      outline: none;
    }

    input[type=range] {
      padding: 0;
      width: 110px;
      cursor: pointer;
    }

    .val-badge {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      min-width: 20px;
    }

    #map-wrap {
      position: relative;
      width: 100%;
      max-width: 960px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    #map-svg { width: 100%; display: block; }

    .county { stroke: #fff; stroke-width: 0.2px; transition: opacity 0.15s; }
    .county:hover { stroke: #333; stroke-width: 0.9px; opacity: 0.85; cursor: pointer; }
    .state-border { fill: none; stroke: #fff; stroke-width: 0.7px; pointer-events: none; }
    .nation-border { fill: none; stroke: #bbb; stroke-width: 0.6px; pointer-events: none; }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(20,20,20,0.88);
      color: #f5f5f5;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 7px;
      line-height: 1.6;
      white-space: nowrap;
      display: none;
      z-index: 999;
    }

    #tooltip strong { font-size: 13px; display: block; margin-bottom: 2px; }

    .legend-wrap {
      display: flex;
      justify-content: flex-start;
      margin-top: 12px;
      width: 100%;
      max-width: 960px;
    }

    .legend-label {
      font-size: 10px;
      fill: #555;
    }

    .legend-axis-label {
      font-size: 10px;
      fill: #444;
      font-weight: 600;
    }

    .no-data-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      position: absolute;
      bottom: 18px;
      right: 18px;
      font-size: 11px;
      color: #666;
    }

    .no-data-swatch {
      width: 14px;
      height: 14px;
      background: #d3d3d3;
      border-radius: 2px;
      border: 1px solid #ccc;
    }

    #loading {
      text-align: center;
      padding: 60px 20px;
      font-size: 14px;
      color: #888;
    }

    #charts-wrap {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
      width: 100%;
      max-width: 960px;
    }

    .chart-panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.09);
      padding: 14px 16px 10px;
    }

    .chart-panel h3 {
      font-size: 12px;
      font-weight: 600;
      color: #444;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chart-panel .chart-subtitle {
      font-size: 10.5px;
      color: #999;
      margin-bottom: 8px;
    }

    .chart-panel svg { width: 100%; display: block; }

    .chart-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
      font-size: 10px;
      color: #666;
    }

    .chart-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chart-legend-swatch {
      width: 18px;
      height: 3px;
      border-radius: 2px;
    }

    .chart-legend-swatch.dashed {
      background: repeating-linear-gradient(
        90deg, currentColor 0, currentColor 4px, transparent 4px, transparent 7px
      );
      height: 2px;
    }
  </style>
</head>
<body>

<h1 id="map-title">Bivariate Map: Mean Housing Metric</h1>
<p class="subtitle" id="map-subtitle">6-month window before vs. after wildfire incident (by county)</p>

<div class="controls">
  <div class="control-group">
    <label for="metric-select">Metric</label>
    <select id="metric-select"></select>
  </div>
  <div class="control-group">
    <label for="nmonths-slider">Window (months)</label>
    <input type="range" id="nmonths-slider" min="1" max="12" value="6" step="1">
    <span class="val-badge" id="nmonths-val">6</span>
  </div>
</div>

<div id="map-wrap">
  <div id="loading">Loading county boundaries…</div>
  <svg id="map-svg" viewBox="0 0 960 640" style="display:none;"></svg>
  <div class="no-data-legend" id="no-data-legend" style="display:none;">
    <div class="no-data-swatch"></div>
    <span>No incident data</span>
  </div>
</div>
<div class="legend-wrap" id="legend-wrap"></div>
<div id="charts-wrap"></div>

<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(async () => {

// BIVARIATE PALETTE (Stevens 3x3, same as Python version)
// Keys: "[bin_before],[bin_after]"  where 0=low, 2=high
const BIVARIATE_PALETTE = {
  '0,0': '#e8e8e8', '0,1': '#ace4e4', '0,2': '#5ac8c8',
  '1,0': '#dfb0d6', '1,1': '#a5add3', '1,2': '#5698b9',
  '2,0': '#be64ac', '2,1': '#8c62aa', '2,2': '#3b4994',
};

const NO_DATA_COLOR = '#d3d3d3';

// SYNTHETIC DATA GENERATOR
// Replace generateData() with real data loading.
// To load real data, use d3.csv("your_incident_housing.csv") inside an async function
// Expects rows: { fips, month_offset_from_incident, <metric> }
function generateData(metric, nMonths) {
  /*
   * Simulates aggregation of incident_housing_df equivalent to:
   *   before = df[df.month_offset.between(-n, -1)].groupby("fips")[metric].mean()
   *   after  = df[df.month_offset.between( 1,  n)].groupby("fips")[metric].mean()
   *
   * Returns Map<fips_string -> { meanBefore, meanAfter }>
   * for a random ~800 counties (the rest get no-data gray).
   */
  const rng = mulberry32(42 + metric.length * 7 + nMonths * 3);
  const metricBase = {
    median_sale_price:    250000,
    median_days_on_market: 45,
    homes_sold:            120,
    new_listings:          180,
  }[metric] || 100;

  const data = new Map();
  // Pick ~800 counties to have incident data
  const affectedFips = new Set();
  while (affectedFips.size < 820) {
    const state = String(Math.floor(rng() * 56 + 1)).padStart(2, '0');
    const county = String(Math.floor(rng() * 200 + 1)).padStart(3, '0');
    affectedFips.add(state + county);
  }

  for (const fips of affectedFips) {
    // Add a spatial gradient: counties with higher FIPS tend to see larger drops
    const trend = (parseInt(fips) % 100) / 100;
    const base = metricBase * (0.7 + rng() * 0.6);
    const change = (rng() - 0.35) * metricBase * 0.4 * (1 + trend);
    data.set(fips, {
      meanBefore: base,
      meanAfter:  base + change,
      fips,
    });
  }
  return data;
}

// Simple seedable PRNG (Mulberry32)
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// QUANTILE BINNING  (equivalent to pd.qcut(q=3, labels=[0,1,2]))
function makeBinner(values) {
  // d3.scaleQuantile maps a continuous domain to discrete range
  return d3.scaleQuantile()
    .domain(values)
    .range([0, 1, 2]);
}

// MAIN RENDER
const svg     = d3.select('#map-svg');
const tooltip = document.getElementById('tooltip');
const W = 960, H = 580;

// geoAlbersUsa already composites CONUS + scaled Alaska + scaled Hawaii insets
const projection = d3.geoAlbersUsa().scale(1280).translate([480, 330]);
const pathGen    = d3.geoPath().projection(projection);

let usTopoJSON   = null;
let countyNames  = new Map();
let rawData      = null;   // CSV rows cached after first load

async function fetchWithFallback(urls, timeoutMs = 8000) {
  for (const url of urls) {
    try {
      const ctrl = new AbortController();
      const tid  = setTimeout(() => ctrl.abort(), timeoutMs);
      const res  = await fetch(url, { signal: ctrl.signal });
      clearTimeout(tid);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (e) {
      console.warn(`Failed to load ${url}:`, e.message);
    }
  }
  throw new Error('All CDN sources failed.');
}

async function init() {
  // Load county TopoJSON — tries three CDNs in order
  usTopoJSON = await fetchWithFallback([
    'https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json',
    'https://unpkg.com/us-atlas@3/counties-10m.json',
    'https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/us-atlas/counties-10m.json',
  ]);

  // Load CSV once and cache — replace path with your real file
  rawData = await d3.csv("incident_housing.csv");

  // Populate dropdown from all numeric columns, excluding non-metric identifiers
  const EXCLUDED = new Set(['fips', 'month_offset_from_incident', 'incident_num']);
  const firstRow = rawData[0] || {};
  const numericCols = Object.keys(firstRow).filter(k => {
    if (EXCLUDED.has(k)) return false;
    const v = firstRow[k];
    return v !== '' && !isNaN(+v);
  });
  if (numericCols.length === 0) throw new Error('No plottable numeric columns found in incident_housing.csv');
  numericCols.sort((a, b) => a.localeCompare(b));

  const select = document.getElementById('metric-select');
  numericCols.forEach(col => {
    const opt = document.createElement('option');
    opt.value = col;
    opt.textContent = col.replace(/_/g, ' ');
    select.appendChild(opt);
  });

  // Build FIPS → name lookup from TopoJSON properties
  topojson.feature(usTopoJSON, usTopoJSON.objects.counties)
    .features.forEach(f => {
      const id = String(f.id).padStart(5, '0');
      countyNames.set(id, f.properties.name || id);
    });

  document.getElementById('loading').style.display = 'none';
  svg.style('display', 'block');
  document.getElementById('no-data-legend').style.display = 'flex';

  render();
}

function render() {
  const metric  = document.getElementById('metric-select').value;
  const nMonths = +document.getElementById('nmonths-slider').value;

  // 1. Group rows by (fips, incident_num) and accumulate sums for mean before/after
  //    Each unique incident gets its own before/after mean, then means are
  //    combined with a recency-weighted average (higher incident_num = more recent = higher weight)
  const incidentMap = new Map(); // "fips|incident_num" -> { fips, incidentNum, beforeSum, beforeCount, afterSum, afterCount }

  rawData.forEach(row => {
    const fips        = String(row.fips).padStart(5, '0');
    const incidentNum = row.incident_num;
    const offset      = +row.month_offset_from_incident;
    const val         = +row[metric];
    if (isNaN(val)) return;

    const key = `${fips}|${incidentNum}`;
    if (!incidentMap.has(key)) {
      incidentMap.set(key, {
        fips,
        incidentNum: +incidentNum,
        beforeSum: 0, beforeCount: 0,
        afterSum:  0, afterCount:  0,
      });
    }
    const e = incidentMap.get(key);
    if (offset >= -nMonths && offset <= -1) { e.beforeSum += val; e.beforeCount++; }
    if (offset >= 1        && offset <= nMonths) { e.afterSum  += val; e.afterCount++;  }
  });

  // 2. Group per-incident means by fips, keeping only incidents with both windows populated
  const fipsIncidents = new Map(); // fips -> [{ incidentNum, meanBefore, meanAfter }]
  for (const e of incidentMap.values()) {
    if (e.beforeCount === 0 || e.afterCount === 0) continue;
    if (!fipsIncidents.has(e.fips)) fipsIncidents.set(e.fips, []);
    fipsIncidents.get(e.fips).push({
      incidentNum: e.incidentNum,
      meanBefore:  e.beforeSum / e.beforeCount,
      meanAfter:   e.afterSum  / e.afterCount,
    });
  }

  // 3. Weighted average per county
  //    Incidents sorted ascending by incident_num; rank 1..k assigned so the
  //    most recent incident (highest incident_num) receives the highest weight.
  //    Linear weights: w_i = rank_i,  total = k*(k+1)/2
  const countyData = new Map();
  for (const [fips, incidents] of fipsIncidents) {
    incidents.sort((a, b) => a.incidentNum - b.incidentNum);
    const k           = incidents.length;
    const totalWeight = k * (k + 1) / 2;
    let weightedBefore = 0, weightedAfter = 0;
    incidents.forEach((inc, i) => {
      const w = i + 1; // rank: oldest=1, most recent=k
      weightedBefore += w * inc.meanBefore;
      weightedAfter  += w * inc.meanAfter;
    });
    countyData.set(fips, {
      meanBefore: weightedBefore / totalWeight,
      meanAfter:  weightedAfter  / totalWeight,
    });
  }

  // 2. Quantile-bin each axis into 3 equal-count classes
  const beforeVals = [...countyData.values()].map(d => d.meanBefore);
  const afterVals  = [...countyData.values()].map(d => d.meanAfter);
  const binBefore  = makeBinner(beforeVals);
  const binAfter   = makeBinner(afterVals);

  // 3. Colour lookup per county FIPS
  const colorOf = (fips) => {
    const d = countyData.get(fips);
    if (!d) return NO_DATA_COLOR;
    const bB = binBefore(d.meanBefore);
    const bA = binAfter(d.meanAfter);
    return BIVARIATE_PALETTE[`${bB},${bA}`] || NO_DATA_COLOR;
  };

  // 4. Extract GeoJSON features from TopoJSON
  const countiesGeo = topojson.feature(usTopoJSON, usTopoJSON.objects.counties);
  const statesGeo   = topojson.mesh(usTopoJSON, usTopoJSON.objects.states,
                                    (a, b) => a !== b);
  const nationGeo   = topojson.mesh(usTopoJSON, usTopoJSON.objects.nation);

  // 5. Draw counties (join pattern for smooth re-renders)
  svg.selectAll('.county')
    .data(countiesGeo.features, d => d.id)
    .join('path')
      .attr('class', 'county')
      .attr('d', pathGen)
      .attr('fill', d => colorOf(String(d.id).padStart(5, '0')))
      .on('mousemove', function(event, d) {
        const fips = String(d.id).padStart(5, '0');
        const cd   = countyData.get(fips);
        const name = countyNames.get(fips) || fips;
        const metricLabel = metric.replace(/_/g, ' ')
          .replace(/\b\w/g, c => c.toUpperCase());

        tooltip.style.display = 'block';
        tooltip.style.left    = (event.clientX + 14) + 'px';
        tooltip.style.top     = (event.clientY - 10) + 'px';

        if (cd) {
          const fmt = d3.format(',.4f');
          tooltip.innerHTML = `
            <strong>${name} County</strong>
            FIPS: ${fips}<br>
            ${metricLabel}<br>
            Before (${nMonths} mo avg): ${fmt(cd.meanBefore)}<br>
            After  (${nMonths} mo avg): ${fmt(cd.meanAfter)}
          `;
        } else {
          tooltip.innerHTML = `<strong>${name} County</strong><br>No incident data`;
        }
      })
      .on('mouseleave', () => { tooltip.style.display = 'none'; });

  // 6. State and nation borders (on top of counties)
  svg.selectAll('.state-border').remove();
  svg.append('path').attr('class', 'state-border').attr('d', pathGen(statesGeo));

  svg.selectAll('.nation-border').remove();
  svg.append('path').attr('class', 'nation-border').attr('d', pathGen(nationGeo));

  // 7. Bivariate legend
  drawLegend(metric, nMonths, binBefore, binAfter, beforeVals, afterVals);

  // 8. Title update
  const metricLabel = metric.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  document.getElementById('map-title').textContent =
    `Bivariate Map: Mean ${metricLabel}`;
  document.getElementById('map-subtitle').textContent =
    `${nMonths}-month window before vs. after wildfire incident (by county)`;

  // 9. Representative county sparklines
  const reps = pickRepresentativeCounties(countyData, binBefore, binAfter);
  drawSparklines(reps, metric, nMonths);
}

// BIVARIATE LEGEND  (SVG 3×3 colour matrix, same layout as Python version)
function drawLegend(metric, nMonths, binBefore, binAfter, beforeVals, afterVals) {
  const wrap = document.getElementById('legend-wrap');
  wrap.innerHTML = '';

  const cell   = 20;
  const pad    = 2;
  const size   = cell * 3 + pad * 2;
  const margin = { top: 28, right: 10, bottom: 40, left: 48 };
  const W      = size + margin.left + margin.right;
  const H      = size + margin.top  + margin.bottom;

  const metricLabel = metric.replace(/_/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());

  const svgL = d3.select(wrap).append('svg')
    .attr('width', W).attr('height', H)
    .style('background', 'rgba(255,255,255,0.88)')
    .style('border-radius', '8px')
    .style('box-shadow', '0 1px 4px rgba(0,0,0,0.10)');

  const g = svgL.append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

  // 3×3 colour grid
  [0, 1, 2].forEach(bB => {
    [0, 1, 2].forEach(bA => {
      g.append('rect')
        .attr('x', pad + bA * cell)
        .attr('y', pad + (2 - bB) * cell)
        .attr('width', cell - 1)
        .attr('height', cell - 1)
        .attr('rx', 2)
        .attr('fill', BIVARIATE_PALETTE[`${bB},${bA}`]);
    });
  });

  // Outer border
  g.append('rect')
    .attr('x', pad).attr('y', pad)
    .attr('width', cell * 3).attr('height', cell * 3)
    .attr('fill', 'none').attr('stroke', '#aaa').attr('stroke-width', 0.5);

  // X-axis label (After)
  svgL.append('text')
    .attr('class', 'legend-axis-label')
    .attr('x', margin.left + pad + cell * 1.5)
    .attr('y', margin.top + size + pad + 14)
    .attr('text-anchor', 'middle')
    .attr('font-size', 10)
    .attr('fill', '#444')
    .attr('font-family', 'inherit')
    .text(`After (${nMonths} mo) →`);

  // Y-axis label (Before) — rotated
  svgL.append('text')
    .attr('class', 'legend-axis-label')
    .attr('transform', `translate(14, ${margin.top + pad + cell * 1.5}) rotate(-90)`)
    .attr('text-anchor', 'middle')
    .attr('font-size', 10)
    .attr('fill', '#444')
    .attr('font-family', 'inherit')
    .text(`Before (${nMonths} mo) →`);

  // Low/High tick labels
  [['Low', 0], ['High', cell * 3]].forEach(([label, offset]) => {
    svgL.append('text')
      .attr('x', margin.left + pad + offset)
      .attr('y', margin.top + size + pad + 26)
      .attr('text-anchor', 'middle')
      .attr('font-size', 9)
      .attr('fill', '#666')
      .attr('font-family', 'inherit')
      .text(label);

    svgL.append('text')
      .attr('transform', `translate(26, ${margin.top + pad + (cell * 3 - offset)}) rotate(-90)`)
      .attr('text-anchor', 'middle')
      .attr('font-size', 9)
      .attr('fill', '#666')
      .attr('font-family', 'inherit')
      .text(label);
  });

  // Title
  svgL.append('text')
    .attr('x', W / 2)
    .attr('y', 14)
    .attr('text-anchor', 'middle')
    .attr('font-size', 9.5)
    .attr('font-weight', '600')
    .attr('fill', '#333')
    .attr('font-family', 'inherit')
    .text(metricLabel.length > 22 ? metricLabel.slice(0, 20) + '…' : metricLabel);
}

// REPRESENTATIVE COUNTY SELECTION
// Picks one representative county from each of the 9 bivariate bins.
// Bins are ordered row-by-row: before=2 (high) down to before=0 (low),
// matching the bivariate legend layout (top-left = high-before/low-after).
// Within each bin, selects the county whose (meanBefore + meanAfter)/2 is
// closest to the median score of all counties in that bin.
function pickRepresentativeCounties(countyData, binBefore, binAfter) {
  const BEFORE_LABELS = ['low', 'mid', 'high'];
  const AFTER_LABELS  = ['low', 'mid', 'high'];

  // Build all 9 bins; order rows high→low before (matches legend orientation)
  const BINS = [];
  for (let bB = 2; bB >= 0; bB--) {
    for (let bA = 0; bA <= 2; bA++) {
      BINS.push({
        bB, bA,
        label: `Before: ${BEFORE_LABELS[bB]} · After: ${AFTER_LABELS[bA]}`,
        color: BIVARIATE_PALETTE[`${bB},${bA}`],
        counties: [],
      });
    }
  }

  for (const [fips, d] of countyData) {
    const bB  = binBefore(d.meanBefore);
    const bA  = binAfter(d.meanAfter);
    const bin = BINS.find(b => b.bB === bB && b.bA === bA);
    if (bin) bin.counties.push({ fips, score: (d.meanBefore + d.meanAfter) / 2 });
  }

  return BINS.map(bin => {
    if (bin.counties.length === 0) return { ...bin, fips: null };
    bin.counties.sort((a, b) => a.score - b.score);
    const median = bin.counties[Math.floor(bin.counties.length / 2)].score;
    const rep = bin.counties.reduce((best, c) =>
      Math.abs(c.score - median) < Math.abs(best.score - median) ? c : best
    );
    return { ...bin, fips: rep.fips };
  });
}

// TIME SERIES EXTRACTION
// Returns sorted monthly rows for the most recent incident in the county,
// within the [-nMonths, nMonths] window (offset 0 excluded).
function getTimeSeries(fips, metric, nMonths) {
  const countyRows = rawData.filter(r => String(r.fips).padStart(5, '0') === fips);
  if (countyRows.length === 0) return [];

  const latestIncident = Math.max(...countyRows.map(r => +r.incident_num));

  // Detect homes_sold column case-insensitively
  const allKeys      = Object.keys(rawData[0] || {});
  const homesSoldCol = allKeys.find(k => k.toLowerCase() === 'homes_sold') || null;

  return countyRows
    .filter(r => +r.incident_num === latestIncident)
    .map(r => ({
      offset:     +r.month_offset_from_incident,
      value:      +r[metric],
      homesSold:  homesSoldCol ? +r[homesSoldCol] : NaN,
    }))
    .filter(r => r.offset !== 0 && Math.abs(r.offset) <= nMonths && !isNaN(r.value))
    .sort((a, b) => a.offset - b.offset);
}

// SPARKLINE CHARTS
// Draws one D3 line chart per representative county in #charts-wrap.
// Each chart shows the monthly metric line, before/after background shading,
// a vertical incident marker, and avg-homes-sold reference lines as an overlay.
function drawSparklines(reps, metric, nMonths) {
  const wrap = document.getElementById('charts-wrap');
  wrap.innerHTML = '';

  const metricLabel = metric.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  const M  = { top: 20, right: 52, bottom: 36, left: 52 };
  const IW = 230;   // inner chart width
  const IH = 130;   // inner chart height
  const SW = IW + M.left + M.right;
  const SH = IH + M.top  + M.bottom;

  reps.forEach(rep => {
    const panel = document.createElement('div');
    panel.className = 'chart-panel';

    const countyName = rep.fips ? (countyNames.get(rep.fips) || rep.fips) : 'No data';
    panel.innerHTML = `
      <h3>${countyName} County</h3>
      <div class="chart-subtitle">${rep.label}</div>
    `;

    if (!rep.fips) {
      panel.innerHTML += `<p style="font-size:12px;color:#aaa;padding:20px 0">No counties in this tercile</p>`;
      wrap.appendChild(panel);
      return;
    }

    const series = getTimeSeries(rep.fips, metric, nMonths);
    if (series.length === 0) {
      panel.innerHTML += `<p style="font-size:12px;color:#aaa;padding:20px 0">No time-series data available</p>`;
      wrap.appendChild(panel);
      return;
    }

    const beforeRows = series.filter(r => r.offset < 0);
    const afterRows  = series.filter(r => r.offset > 0);
    const hasHomes   = series.some(r => !isNaN(r.homesSold) && r.homesSold > 0);

    const avgHomesBefore = hasHomes
      ? d3.mean(beforeRows.filter(r => !isNaN(r.homesSold)), r => r.homesSold)
      : null;
    const avgHomesAfter = hasHomes
      ? d3.mean(afterRows.filter(r => !isNaN(r.homesSold)), r => r.homesSold)
      : null;

    // Scales
    const xScale = d3.scaleLinear()
      .domain([-nMonths, nMonths])
      .range([0, IW]);

    const yExtent = d3.extent(series, r => r.value);
    const yPad    = (yExtent[1] - yExtent[0]) * 0.12 || 1;
    const yScale  = d3.scaleLinear()
      .domain([yExtent[0] - yPad, yExtent[1] + yPad])
      .range([IH, 0]);

    // Secondary scale for homes_sold (right axis)
    const homesExtent = hasHomes
      ? d3.extent(series.filter(r => !isNaN(r.homesSold)), r => r.homesSold)
      : [0, 1];
    const homesPad   = (homesExtent[1] - homesExtent[0]) * 0.15 || 1;
    const homesScale = d3.scaleLinear()
      .domain([0, homesExtent[1] + homesPad])
      .range([IH, 0]);

    const svgEl = d3.select(panel).append('svg')
      .attr('viewBox', `0 0 ${SW} ${SH}`);

    const g = svgEl.append('g').attr('transform', `translate(${M.left},${M.top})`);

    // Before/after background shading
    g.append('rect')
      .attr('x', xScale(-nMonths)).attr('y', 0)
      .attr('width', xScale(0) - xScale(-nMonths)).attr('height', IH)
      .attr('fill', '#e8f4fd').attr('opacity', 0.6);

    g.append('rect')
      .attr('x', xScale(0)).attr('y', 0)
      .attr('width', xScale(nMonths) - xScale(0)).attr('height', IH)
      .attr('fill', '#fdecea').attr('opacity', 0.6);

    // Homes sold bars (secondary axis, behind the metric line)
    if (hasHomes) {
      const barW = Math.max(2, (IW / (nMonths * 2)) * 0.6);
      series.filter(r => !isNaN(r.homesSold) && r.homesSold > 0).forEach(r => {
        g.append('rect')
          .attr('x', xScale(r.offset) - barW / 2)
          .attr('y', homesScale(r.homesSold))
          .attr('width', barW)
          .attr('height', IH - homesScale(r.homesSold))
          .attr('fill', '#bbb').attr('opacity', 0.35);
      });

      // Avg homes sold reference lines
      if (avgHomesBefore != null) {
        const y = homesScale(avgHomesBefore);
        g.append('line')
          .attr('x1', xScale(-nMonths)).attr('x2', xScale(-0.5))
          .attr('y1', y).attr('y2', y)
          .attr('stroke', '#5b9bd5').attr('stroke-width', 1.5)
          .attr('stroke-dasharray', '4,3');
      }
      if (avgHomesAfter != null) {
        const y = homesScale(avgHomesAfter);
        g.append('line')
          .attr('x1', xScale(0.5)).attr('x2', xScale(nMonths))
          .attr('y1', y).attr('y2', y)
          .attr('stroke', '#e06c75').attr('stroke-width', 1.5)
          .attr('stroke-dasharray', '4,3');
      }

      // Right axis (homes sold)
      const homesAxis = d3.axisRight(homesScale).ticks(3).tickSize(3);
      g.append('g')
        .attr('transform', `translate(${IW},0)`)
        .call(homesAxis)
        .call(a => a.select('.domain').remove())
        .call(a => a.selectAll('text')
          .style('font-size', '8px').style('fill', '#999'));
    }

    // Incident vertical line
    g.append('line')
      .attr('x1', xScale(0)).attr('x2', xScale(0))
      .attr('y1', 0).attr('y2', IH)
      .attr('stroke', '#888').attr('stroke-width', 1)
      .attr('stroke-dasharray', '3,3');

    g.append('text')
      .attr('x', xScale(0) + 3).attr('y', 8)
      .attr('font-size', '8px').attr('fill', '#999')
      .text('Incident');

    // Metric line
    const line = d3.line()
      .x(r => xScale(r.offset))
      .y(r => yScale(r.value))
      .defined(r => !isNaN(r.value));

    g.append('path')
      .datum(series)
      .attr('fill', 'none')
      .attr('stroke', rep.color)
      .attr('stroke-width', 2)
      .attr('d', line);

    // Dots on metric line
    g.selectAll('.dot')
      .data(series)
      .join('circle')
        .attr('class', 'dot')
        .attr('cx', r => xScale(r.offset))
        .attr('cy', r => yScale(r.value))
        .attr('r', 2.5)
        .attr('fill', rep.color);

    // X axis
    const xAxis = d3.axisBottom(xScale)
      .ticks(Math.min(nMonths * 2, 10))
      .tickSize(3)
      .tickFormat(d => d === 0 ? '' : d);

    g.append('g')
      .attr('transform', `translate(0,${IH})`)
      .call(xAxis)
      .call(a => a.select('.domain').attr('stroke', '#ccc'))
      .call(a => a.selectAll('text').style('font-size', '8px').style('fill', '#888'))
      .call(a => a.selectAll('line').attr('stroke', '#ddd'));

    g.append('text')
      .attr('x', IW / 2).attr('y', IH + 30)
      .attr('text-anchor', 'middle')
      .attr('font-size', '9px').attr('fill', '#888')
      .text('Month offset from incident');

    // Y axis (left)
    const yAxis = d3.axisLeft(yScale).ticks(4).tickSize(3);
    g.append('g')
      .call(yAxis)
      .call(a => a.select('.domain').attr('stroke', '#ccc'))
      .call(a => a.selectAll('text').style('font-size', '8px').style('fill', '#888'))
      .call(a => a.selectAll('line').attr('stroke', '#ddd'));

    // Legend
    const legendDiv = document.createElement('div');
    legendDiv.className = 'chart-legend';
    legendDiv.innerHTML = `
      <span class="chart-legend-item">
        <span class="chart-legend-swatch" style="background:${rep.color}"></span>
        ${metricLabel}
      </span>
      ${hasHomes ? `
      <span class="chart-legend-item">
        <span class="chart-legend-swatch" style="background:#bbb;height:8px;opacity:0.5"></span>
        Homes sold
      </span>
      <span class="chart-legend-item" style="color:#5b9bd5">
        <span class="chart-legend-swatch dashed" style="color:#5b9bd5"></span>
        Avg before
      </span>
      <span class="chart-legend-item" style="color:#e06c75">
        <span class="chart-legend-swatch dashed" style="color:#e06c75"></span>
        Avg after
      </span>` : ''}
    `;
    panel.appendChild(legendDiv);
    wrap.appendChild(panel);
  });
}

// CONTROLS
document.getElementById('nmonths-slider').addEventListener('input', function() {
  document.getElementById('nmonths-val').textContent = this.value;
  render();
});
document.getElementById('metric-select').addEventListener('change', render);

// START
try {
  await init();
} catch (err) {
  document.getElementById('loading').innerHTML = `
    <strong style="color:#c0392b">Failed to load county boundaries.</strong><br>
    <span style="font-size:12px;color:#888">
      All CDN sources were unreachable.<br>
      Try: opening DevTools → Network tab to see which request is failing,
      disabling any VPN or firewall, or re-deploying to Netlify and hard-refreshing (Ctrl+Shift+R).
    </span>`;
  console.error(err);
}

})(); // end async IIFE
</script>
</body>
</html>
