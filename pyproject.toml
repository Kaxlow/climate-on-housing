[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-climate-risk"
version = "0.1.0"
description = "Data pipeline and visualization builders for housing-market climate risk analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "duckdb",
    "geopandas",
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "patsy",
    "pyarrow",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
]

[project.scripts]
build-climate-risk-housing = "housing_climate_risk.page_data.climate_risk_housing:main"
build-database = "housing_climate_risk.cli.build_database:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
