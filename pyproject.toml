[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-climate-risk"
version = "0.1.0"
description = "Data pipeline and visualization builders for housing-market climate risk analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "geopandas",
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "patsy",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
]

[project.scripts]
build-page = "housing_climate_risk.cli.build_page:main"
run-county-clustering = "housing_climate_risk.cli.run_county_clustering:main"
run-broad-county-profiles = "housing_climate_risk.cli.run_broad_county_profiles:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
